# docker compose up --build   ->  UI http://localhost:8080 , API http://localhost:8000/docs
# Prerequisite: the data pipeline and training have been run once on the host (see README),
# so backend/data and backend/artifacts exist; they are mounted, not baked into the image.
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - ./backend/data:/app/data
      - ./backend/artifacts:/app/artifacts
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
